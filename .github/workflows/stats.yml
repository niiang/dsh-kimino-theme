name: Stats

# Daily growth chart: npm cumulative downloads + GitHub stars -> docs/stats.svg
# (mirrors the dsh-dream-skin "growth curve" footer design, zero deps)

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats.svg docs/stats-history.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(stats): daily growth chart [skip ci]"
          git push
