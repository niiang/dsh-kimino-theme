# dsh-kimino-theme bundle patch: mounts the theme plugin row.
# Install into a dsh profile with:
#   dsh plugin --profile web add link:<path-to-this-repo>
# The row `name` must resolve to this package from the profile (that is what
# `dsh plugin add` installs). One row mounts BOTH halves: the host half is
# the package main (plugin/host.js — wallpaper/logo asset routes) and the
# browser half is the package's ./client export (plugin/client.js — theme
# tokens, component styles and DOM patch-ups), picked up automatically by
# the client module system via the dsh.client declaration in package.json.
- insert:
    - id: kimino-theme
      name: dsh-kimino-theme
